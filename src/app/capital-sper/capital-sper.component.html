
<div *ngIf="!this.lancer" class='container'>
        <div   *ngFor="let carte of this.getCartes()" style="color: rgb(3, 155, 229);
         ;display: inline-block;cursor: pointer;" 
        ><!-- async = subcribe-->
            <tbody  >
                <tr >
                <td></td>
                <td style="text-align:center">
                    <div  style="display: inline-block;">
                        <div class="card-content">
                            <span class="card-title center-align">{{carte.nom}}</span>
                        </div>
                        <img class="responsive-img" [src]="carte.illustration"  style="width: 50%;" [alt]="carte.nom" >
                        <div class="card-action">
                            <i *ngIf="this.getNb(carte.id) == 1" class=" inline-icon material-icons left" (click)="this.diminuer(carte)" > cancel</i>
                            <i *ngIf="this.getNb(carte.id) > 1" class=" inline-icon material-icons left" (click)="this.diminuer(carte)" > - </i>
                            <span class="  middle"  > {{this.getNb(carte.id)}}</span>
                            <i *ngIf="carte.id == 1 || carte.id == 2" class=" inline-icon material-icons right" (click)="this.incrementer(carte)" >add</i>
                        </div>
                    
                        
                        
                    
                </div>
             </td>
            </tr>
        
        
        
    </div>
    <app-search-carte> </app-search-carte>
    <div class="container">
        <div class="input-field col s6" >
            <label for="nbPartie" ></label>
            <input placeholder="Entrer le nombre de partie que vous voulez lancer entre 1 et 100 : " id="nbPartie" type="number" min="1"  max="100" (keyup)="setNbPartie()">
           </div>
        <button class="btn waves-effect waves-light" name="action" (click)="this.simulation()"  >Lancer une simulation
            <i class="material-icons right">send</i>
        </button>
        
    </div>
    
   
    


</div>

<div *ngIf="this.lancer && !this.tab " >
    <app-loader></app-loader>
</div>

<div *ngIf="this.lancer && this.tab ">
  <div  class="row">
    <div class="col s12 m8 offset-m2">
    <div class="card vertical hoverable" >
      <div class="card-stacked" >
        <div class="card-content" >
          <table  style="width: 100%;
          border-collapse: collapse;
          table-layout: auto;" >
            <tbody >
                <pre style=" white-space: pre-wrap;">{{ this.getPartie() }}</pre>
            </tbody>
            </table> 
        </div>
        <div class="card-action">
            <a (click)="goMenu()" style="cursor: pointer;">Accueil</a>
            <a (click)="retour()" style="cursor: pointer;">Retour</a>
            <a (click)="relancer()" style="cursor: pointer;">Relancer</a>
          </div>
    </div>

</div>
