<div *ngIf="camp" class="row">
    <div class="col s12 m8 offset-m2" >
    <h2 class="header center">Le camp des {{ camp.nom.toLowerCase() }}</h2>
    <div class="center">
        <img class="responsive-img center" [src]="camp.illustration"  [alt]="camp.nom" />
    </div>
    <div class="card vertical hoverable" >
      <div class="card-stacked"  >
        <div class="card-content" >
          <table class="tableau" >
            <tbody >
              <tr>
                <td >Nom du camp :</td>
                <td class="center" ><strong >Les {{camp.nom.toLowerCase()}}</strong></td>
              </tr>
              <tr>
                <td >But :</td>
                <td class="center">
                  <strong>
                    {{camp.but}}
                  </strong>
                </td>
              </tr>
              <tr >
                <td >Description :</td>
                <td class="colonne left"><em>{{ camp.description}}</em></td>
              </tr>
              <tr >
                <td style="width: 20%;"> Liste des membres du camp des {{camp.nom.toLowerCase()}} :</td>
                    <td class="center pointeur colonne inline" (click)="goTocarte(carte)" *ngFor="let carte of getcartesQuiACeCamp(camp)">
                        <em >
                            <img class="responsive-img center" width="15%" [src]="carte.illustration"  [alt]="carte.nom" />
                            {{carte.nom}} 
                        </em>
                    </td>
              </tr>
          </table>  
        </div>
        <div class="card-action">
            <a (click)="goMenu()" class="pointeur">Accueil</a>
        </div>
      </div>
    </div>
    </div>
    </div>
    <h3 *ngIf='!camp' class="center">
      <app-loader></app-loader> 
    </h3>
