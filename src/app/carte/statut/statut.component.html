<div *ngIf="carte && statut" class="row">
    <div class="col s12 m8 offset-m2">
    <h2 class="header center">{{ statut.nom }}</h2>
    <div class="card vertical hoverable" >
      <!--<div class="card-image" style="display: flex;justify-content: center;vertical-align: middle;">
        <img [src]="carte.illustration" style="width: 20%;" [alt]="carte.name" >
      </div>-->
      <div class="card-stacked" >
        <div class="card-content" >
          <table  style="width: 100%;
          border-collapse: collapse;
          table-layout: auto;" >
            <tbody >
              <tr >
                <td></td>
                <td style="text-align:center">
                    <img [src]="statut.illustration" class="responsive-img" style="width: 40%;padding-top: 20%;height: 100%;" [alt]="statut.nom" >
                    <img [src]="statut.imageLore" class="right responsive-img" style="width: 40%;height: 100%;" [alt]="statut.nom" >
               </td>
              </tr>
              <tr>
                <td style="display: inline;">Nom :</td>
                <td style="text-align:center"><strong >{{ statut.nom }}</strong></td>
              </tr>

              <tr >
                <td style="display: inline;" >Description :</td>
                <td style="word-break: break-word;text-align:center;
                white-space: normal;width: auto;">
                  {{statut.description}}
                </td>
              </tr>
              <tr >
                <td> Créateur du statut :</td>
                    <td class="center" (click)="goTocarte(carte)"  style="word-break: break-word;text-align:center;
                    white-space: normal;width: auto; display: inline;cursor: pointer;">
                        <img class="responsive-img center" width="15%" [src]="carte.illustration"  [alt]="carte.nom" />
                        {{carte.nom}} 
                    </td>
              </tr>
          </table>
        </div>
        <div class="card-action">
          <a (click)="goMenu()" style="cursor: pointer;">Accueil</a>
        </div>
      </div>
    </div>
  </div>
</div>
<h3 *ngIf='!carte || !statut' class="center">
  <app-loader></app-loader> 
</h3>
