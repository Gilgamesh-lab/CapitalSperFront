<div *ngIf="typesDeCartes" class="row">
    <div class="col s12 m8 offset-m2" >
    <h2 class="header center">Les cartes {{ typesDeCartes.nom.toLowerCase() }}s</h2>
    <div class="center">
        <img class="responsive-img" [src]="typesDeCartes.illustration"  [alt]="typesDeCartes.nom" />
    </div>
    <div class="card vertical hoverable" >
      <div class="card-stacked"  >
        <div class="card-content" >
          <table class="colonne" >
            <tbody >
              <tr>
                <td >Nom du type de la carte :</td>
                <td  class="center" ><strong > Carte {{typesDeCartes.nom.toLowerCase()}}</strong></td>
              </tr>
              <tr >
                <td >Description :</td>
                <td class="left colonne" ><em>{{ typesDeCartes.description}}</em></td>
              </tr>
              <tr >
                <td style="width: 20%;"> Liste des cartes {{ typesDeCartes.nom.toLocaleLowerCase()}}s  :</td>
                    <td class="center colonne inline pointeur" (click)="goTocarte(carte)" *ngFor="let carte of getcartesQuiACeTypeDeCartes(typesDeCartes)">
                        <em >
                            <img class="responsive-img center" width="15%" [src]="carte.illustration"  [alt]="carte.nom" />
                            {{carte.nom}} 
                        </em>
                    </td>
              </tr>
          </table>  
        </div>
        <div class="card-action pointeur">
            <a (click)="goMenu()">Accueil</a>
          
        </div>
      </div>
    </div>
    </div>
    </div>
    <h3 *ngIf='!typesDeCartes' class="center">
      <app-loader></app-loader> 
    </h3>
