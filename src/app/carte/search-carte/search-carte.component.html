
<div class="row">
    <div class="col s12 m6 offset-m3">
        <div class="card">
            <div class="card content">
                <div class="input-field">
                    <input 
                        #searchBox
                        (keyup)="search(searchBox.value)"
                        placeholder={{this.getMessage()}}> 
                    <div class="collection pointeur">
                        <a *ngFor="let carte of cartes | async" 
                        (click)="action(carte)"
                        class="collection-item"><!-- async = subcribe-->
                            <img class="responsive-img taille-illustration" [src]="carte.illustration" [alt]="carte.nom" >
                            {{carte.nom}}
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
