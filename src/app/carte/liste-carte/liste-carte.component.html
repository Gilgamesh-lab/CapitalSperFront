
<div class='container'>
    <p class="center blue-text">
        <strong (click)="goToRegles()" class="surlignage">
            Les règles du jeu
        </strong>
        
    </p>
    <app-search-carte> </app-search-carte>
    <div *ngIf='!ListeDecartes' class="center">
        <app-loader></app-loader> 
    </div>
    <div class="row disposition-row" >
        
        <div *ngFor="let carte of ListeDecartes" class="col s12 m6 l6 xl4 card-container"  > <!--col m4 s12-->
            <div (click)="goTocarte(carte)"  class="card horizontal alignement-illustration" >
                <div class="card-image" class="taille-image">
                    <img [src]="carte.illustration" [alt]="carte.nom" class="padding-image" />
                </div>
                <div class="card-stacked disposition-stacked">
                    <div class="card-content taille-content">
                        <div>
                            <p>{{carte.nom}}</p>
                            <p>Carte {{carte.typeDeCarte.nom.toLowerCase()}}</p>
                            <p *ngIf="carte.typeDeCarte.id == 1">  
                                <span  [ngClass]="carte.camps.id | carteCampColorPipe:false ">
                                    {{carte.camps.nom}}
                                </span> 
                            </p>
                        </div>
                        <div class="card-image disposition-carte" >
                            <img class="responsive-img" [src]="carte.imageCarte" [alt]="carte.nom" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!--1. 
Mobile (s) : moins de 600px
Tablette (m) : entre 600px et 992px
Ordinateur (l) : entre 993px et 1200px
Grand écran (xl) : plus de 1200px
Si la largeur de ton navigateur est entre 600px et 992px, alors la classe m6 s'applique, ce qui correspond à deux cartes par ligne.

s12 : Une carte occupe toute la largeur sur un petit écran (mobile).
m6 : Deux cartes occupent la largeur sur un écran moyen (tablette).
l4 : Trois cartes occupent la largeur sur un grand écran (ordinateur).-->

<a *ngIf='estConnecter()'
    
    class="btn-floating btn-large waves-effect waves-light red z-depth-3 bouton-ajouter-position"
    (click)="goToAdd()"
    
   
    
>
    +
</a>
